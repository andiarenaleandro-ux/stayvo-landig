<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stayvo — Próximamente</title>
<meta name="description" content="Una nueva forma de gestionar tus alquileres temporarios. Próximamente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:        #0A0D0E;
    --bg2:       #0F1416;
    --surface:   #141A1C;
    --border:    rgba(255,255,255,0.07);
    --text:      #E8E4DC;
    --muted:     rgba(232,228,220,0.45);
    --accent:    #C4956A;
    --accent2:   #7EB8C4;
    --glow:      rgba(196,149,106,0.15);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    overflow: hidden;
  }

  /* CANVAS DE PARTÍCULAS */
  canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.6;
  }

  /* GLOW AMBIENT */
  .ambient {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 60% 50% at 20% 50%, rgba(196,149,106,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 80% 50%, rgba(126,184,196,0.05) 0%, transparent 70%);
  }

  /* LAYOUT */
  .page {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
  }

  /* LOGO */
  .logo-wrap {
    margin-bottom: 48px;
    opacity: 0;
    animation: fadeUp 1s ease 0.2s forwards;
  }

  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(52px, 10vw, 88px);
    letter-spacing: 0.12em;
    color: var(--text);
    line-height: 1;
    position: relative;
    display: inline-block;
  }

  .logo::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 32px;
    height: 1px;
    background: var(--accent);
    animation: expandLine 1.2s ease 1s forwards;
    transform-origin: center;
    scale: 0 1;
  }

  @keyframes expandLine {
    to { scale: 1 1; }
  }

  /* TAGLINE */
  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(16px, 3vw, 22px);
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-bottom: 64px;
    opacity: 0;
    animation: fadeUp 1s ease 0.5s forwards;
  }

  /* SEPARADOR */
  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 48px;
    opacity: 0;
    animation: fadeUp 1s ease 0.7s forwards;
  }

  .divider-line {
    width: 40px;
    height: 1px;
    background: var(--border);
  }

  .divider-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* MENSAJE PRINCIPAL */
  .headline {
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    font-size: clamp(13px, 2.2vw, 16px);
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 1s ease 0.9s forwards;
  }

  .sub {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(26px, 5vw, 40px);
    color: var(--text);
    line-height: 1.4;
    max-width: 520px;
    margin-bottom: 64px;
    opacity: 0;
    animation: fadeUp 1s ease 1.1s forwards;
  }

  .sub em {
    font-style: italic;
    color: var(--accent);
  }

  /* EMAIL FORM */
  .form-wrap {
    opacity: 0;
    animation: fadeUp 1s ease 1.3s forwards;
    width: 100%;
    max-width: 380px;
  }

  .form-label {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 12px;
  }

  .form-row {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    background: var(--surface);
    transition: border-color 0.3s;
  }

  .form-row:focus-within {
    border-color: rgba(196,149,106,0.4);
  }

  .form-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    padding: 14px 16px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    color: var(--text);
    font-weight: 300;
  }

  .form-input::placeholder {
    color: rgba(232,228,220,0.25);
  }

  .form-btn {
    background: none;
    border: none;
    border-left: 1px solid var(--border);
    padding: 14px 18px;
    cursor: pointer;
    color: var(--accent);
    font-size: 16px;
    transition: background 0.2s, color 0.2s;
    display: flex;
    align-items: center;
  }

  .form-btn:hover {
    background: rgba(196,149,106,0.1);
  }

  .form-success {
    display: none;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.1em;
    margin-top: 12px;
    text-transform: uppercase;
  }

  /* FOOTER */
  .footer {
    position: fixed;
    bottom: 32px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 24px;
    z-index: 3;
    opacity: 0;
    animation: fadeUp 1s ease 1.6s forwards;
  }

  .footer-item {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(232,228,220,0.2);
  }

  .footer-sep {
    width: 1px;
    height: 10px;
    background: var(--border);
  }

  /* BADGE COMING SOON */
  .badge {
    position: fixed;
    top: 32px;
    right: 32px;
    z-index: 3;
    opacity: 0;
    animation: fadeIn 1s ease 2s forwards;
  }

  .badge-inner {
    display: flex;
    align-items: center;
    gap: 7px;
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 7px 14px;
    background: var(--surface);
  }

  .badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent2);
    animation: pulse 2s ease infinite;
  }

  .badge-text {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.4; transform: scale(0.8); }
  }

  /* WORDMARK TOP LEFT */
  .wordmark {
    position: fixed;
    top: 36px;
    left: 32px;
    z-index: 3;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 18px;
    letter-spacing: 0.15em;
    color: rgba(232,228,220,0.35);
    opacity: 0;
    animation: fadeIn 1s ease 2s forwards;
  }

  /* ANIMACIONES */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* MOBILE */
  @media (max-width: 480px) {
    .badge { top: 20px; right: 20px; }
    .wordmark { top: 22px; left: 20px; }
    .footer { bottom: 20px; gap: 16px; }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="ambient"></div>

<div class="wordmark">stayvo</div>

<div class="badge">
  <div class="badge-inner">
    <div class="badge-dot"></div>
    <span class="badge-text">Próximamente</span>
  </div>
</div>

<main class="page">
  <div class="logo-wrap">
    <div class="logo">Stayvo</div>
  </div>

  <p class="tagline">Tu propiedad en piloto automático</p>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-dot"></div>
    <div class="divider-line"></div>
  </div>

  <p class="headline">Estamos construyendo algo</p>

  <p class="sub">
    Gestionar tus alquileres temporarios<br>
    nunca debió ser <em>tan complicado.</em>
  </p>

  <div class="form-wrap">
    <label class="form-label">Anotate y sé el primero en saber</label>
    <div class="form-row">
      <input
        class="form-input"
        type="email"
        id="emailInput"
        placeholder="tu@email.com"
        autocomplete="email"
      >
      <button class="form-btn" onclick="handleSubmit()" aria-label="Anotarse">
        →
      </button>
    </div>
    <div class="form-success" id="successMsg">
      ✓ &nbsp;Te avisamos cuando abramos
    </div>
  </div>
</main>

<footer class="footer">
  <span class="footer-item">Mar del Plata</span>
  <div class="footer-sep"></div>
  <span class="footer-item">Argentina</span>
  <div class="footer-sep"></div>
  <span class="footer-item">2026</span>
</footer>

<script>
// Partículas flotantes
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, particles = [];

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function Particle() {
  this.x  = Math.random() * W;
  this.y  = Math.random() * H;
  this.vx = (Math.random() - 0.5) * 0.2;
  this.vy = (Math.random() - 0.5) * 0.15;
  this.r  = Math.random() * 1.2 + 0.3;
  this.a  = Math.random() * 0.35 + 0.05;
  this.color = Math.random() > 0.6
    ? `rgba(196,149,106,${this.a})`
    : `rgba(126,184,196,${this.a})`;
}

Particle.prototype.update = function() {
  this.x += this.vx;
  this.y += this.vy;
  if (this.x < 0) this.x = W;
  if (this.x > W) this.x = 0;
  if (this.y < 0) this.y = H;
  if (this.y > H) this.y = 0;
};

Particle.prototype.draw = function() {
  ctx.beginPath();
  ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
  ctx.fillStyle = this.color;
  ctx.fill();
};

function init() {
  resize();
  particles = Array.from({ length: 80 }, () => new Particle());
}

function drawLines() {
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 100) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(255,255,255,${0.04 * (1 - dist/100)})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  particles.forEach(p => { p.update(); p.draw(); });
  drawLines();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
init();
loop();

// Form
function handleSubmit() {
  const input = document.getElementById('emailInput');
  const msg   = document.getElementById('successMsg');
  const email = input.value.trim();
  if (!email || !email.includes('@')) {
    input.style.borderColor = 'rgba(196,149,106,0.6)';
    input.focus();
    return;
  }
  input.value = '';
  input.placeholder = 'Listo ✓';
  msg.style.display = 'block';
  setTimeout(() => msg.style.display = 'none', 5000);
}

document.getElementById('emailInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSubmit();
});
</script>
</body>
</html>
